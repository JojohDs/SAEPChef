<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/index.css">
    <title>SAEPChef</title>
</head>
<body>

    <header class="cabecalho">
        <section class="usuario-cabecalho">
            <img id="fotoUsuario" src="/frontend/src/anexos_prova/imagens_usuarios/usuario1.jpg" alt="Foto do usuário">
            <div>
                <strong id="nomeUsuario">
                    @SAEPChef
                </strong>

                <button id="botaoPerfil" class="botao botao-escuro" type="button">
                    Ver Perfil
                </button>
            </div>
        </section>

        <a class="marca" href="#">
            SAEPChef
        </a>

        <button id="botaoLogin" class="botao botao-escuro" type="button">
            Login
        </button>

    </header>

    <main class="conteudo">
        <section id="secaoMural">
            <form id="formBusca" class="busca">
                <input id="campoBusca" type="search" placeholder="Digite o nome do chef... ex: @chef1">

                <button type="submit" aria-label="Buscar chef">

                    <img src="/frontend/src/anexos_prova/icones/lupa.svg" alt="">

                </button>
            </form>

            <p id="mensagemBusca" class="mensagem-busca"></p>

            <div id="muralReceitas" class="mural"></div>
            <div id="modalLogin" class="modal escondido">

                <div class="modal-conteudo">
                    <button id="fecharLogin" class="botao-icone" type="button">

                        <img src="/frontend/src/anexos_prova/icones/close.svg" alt="Fechar login">

                    </button>

                    <h2>Login</h2>

                    <form id="formLogin" novalidate>
                        <div class="campo">
                            <label for="email">
                                E-mail
                            </label>
                            <input id="email" type="email" placeholder="Digite seu e-mail">

                            <small id="erroEmail" class="erro"></small>

                        </div>

                        <div class="campo">
                            <label for="senha">
                                Senha
                            </label>
                            <input id="senha" type="password" placeholder="Digite sua senha">

                            <small id="erroSenha" class="erro"></small>

                        </div>

                        <p id="erroLogin" class="erro-login"></p>

                        <div class="acoes-login">
                            <button id="cancelarLogin" class="botao botao-contorno" type="button" >
                                Cancelar
                            </button>

                            <button class="botao botao-escuro" type="submit">
                                Login
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>


    <footer class="rodape">

        <strong>SAEPChef</strong>

        <nav class="redes" aria-label="Redes sociais">
            <a href="#" aria-label="Instagram">
                <img src="/frontend/src/anexos_prova/icones/instagram.svg" alt="">
            </a>

            <a href="#" aria-label="TikTok">

                <img src="/frontend/src/anexos_prova/icones/tiktok.svg" alt="" >
            </a>

            <a href="#" aria-label="LinkedIn">
                <img src="/frontend/src/anexos_prova/icones/linkedin.svg" alt="">
            </a>

            <a href="#" aria-label="YouTube">
                <img src="/frontend/src/anexos_prova/icones/youtube.svg"alt="">
            </a>
        </nav>

        <span>
            Copyright 2026-2027
        </span>

    </footer>
    <script src="/frontend/script.js"></script>
</body>
</html>
